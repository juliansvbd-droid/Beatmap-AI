[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beatmap-ai"
version = "0.1.0"
description = "Generate osu! beatmaps from MP3 files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "librosa>=0.10", "soundfile>=0.12", "miniaudio>=1.59"]

[project.optional-dependencies]
train = ["torch>=2.0", "rosu-pp-py"]
dev = ["pytest", "torch>=2.0", "rosu-pp-py"]

[project.scripts]
beatmap-ai = "beatmap_ai.cli:main"
beatmap-ai-ui = "beatmap_ai.ui:main"

[tool.setuptools]
packages = ["beatmap_ai"]

[tool.setuptools.package-data]
beatmap_ai = ["models/*.pt"]
